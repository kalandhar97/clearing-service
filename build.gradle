plugins {
    id 'java'
    id 'org.springframework.boot' version '3.3.2'
    id 'io.spring.dependency-management' version '1.1.6'

    id 'jacoco'
    id 'org.sonarqube' version '5.1.0.4882'
    id 'org.owasp.dependencycheck' version '10.0.4'
}

group = 'com.paymentprocessor'
version = '1.0.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

ext {
    springCloudVersion = '2023.0.3'
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
    }
}

dependencies {
    // Centralized config (Config Server)
    implementation 'org.springframework.cloud:spring-cloud-starter-config'

    // Web + validation
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    // Persistence
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-database-postgresql'
    runtimeOnly 'org.postgresql:postgresql'

    // Outbound HTTP (WebClient) to the external clearing application
    implementation 'org.springframework.boot:spring-boot-starter-webflux'

    // Messaging (transactional outbox -> Kafka)
    implementation 'org.springframework.kafka:spring-kafka'

    // Resource-server security: validates the RS256 access tokens minted by
    // authentication-service against its published JWK set (see SecurityConfig).
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'

    // Operability
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    // Observability: metrics (Prometheus scrape), traces (OTel -> Collector -> Tempo), JSON logs (Loki)
    implementation 'io.micrometer:micrometer-registry-prometheus'
    implementation 'io.micrometer:micrometer-tracing-bridge-otel'
    implementation 'io.opentelemetry:opentelemetry-exporter-otlp'
    implementation 'net.logstash.logback:logstash-logback-encoder:7.4'

    // API documentation (Swagger UI at /swagger-ui.html)
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.6.0'
}

tasks.named('test') {
    useJUnitPlatform()
    finalizedBy jacocoTestReport
}

jacoco {
    toolVersion = '0.8.12'
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        html.required = true
    }
}

sonar {
    properties {
        property 'sonar.organization', System.getenv('SONAR_ORGANIZATION') ?: 'kalandhar97'
        property 'sonar.projectKey', 'kalandhar97_clearing-service'
        property 'sonar.projectName', 'clearing-service'
        property 'sonar.java.coveragePlugin', 'jacoco'
        property 'sonar.coverage.jacoco.xmlReportPaths',
                "${layout.buildDirectory.get()}/reports/jacoco/test/jacocoTestReport.xml"
        property 'sonar.exclusions', '**/generated/**'
    }
}

dependencyCheck {
    formats = ['HTML', 'JSON']
    failBuildOnCVSS = 8.0
    analyzers {
        assemblyEnabled = false
        nodeAuditEnabled = false
        nodeEnabled = false
    }
    nvd {
        apiKey = System.getenv('NVD_API_KEY') ?: ''
    }
}
