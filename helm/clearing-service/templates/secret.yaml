# Placeholder only — prefer HashiCorp Vault for secrets.
# Do not commit real credentials.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "clearing-service.fullname" . }}-secret
  labels:
    {{- include "clearing-service.labels" . | nindent 4 }}
type: Opaque
stringData:
  DB_PASSWORD: {{ .Values.dbPassword | default "change-me" | quote }}
  SPRING_DATASOURCE_PASSWORD: {{ .Values.dbPassword | default "change-me" | quote }}
